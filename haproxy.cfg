global
    maxconn 4096
    nbthread 1

defaults
    mode tcp
    option tcp-smart-accept
    option tcp-smart-connect
    timeout connect 1s
    timeout client 10s
    timeout server 10s

frontend public
    bind *:9999
    default_backend apis

backend apis
    balance roundrobin
    server api1 api1:8080 maxconn 2048
    server api2 api2:8080 maxconn 2048
