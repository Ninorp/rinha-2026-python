services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  api1: &api
    build: .
    environment:
      ROBYN_HOST: "0.0.0.0"
      ROBYN_PORT: "8080"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "159MB"

  api2:
    <<: *api

networks:
  default:
    driver: bridge
