services:
  lb:
    image: haproxy:3.0-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "20MB"

  api1: &api
    image: rinha-2026-python-local
    build:
      context: .
      args:
        RINHA_IVF_CELLS: "8192"
        RINHA_IVF_SAMPLE: "250000"
        RINHA_IVF_ITERATIONS: "6"
        RINHA_TREE_SAMPLE: "2000000"
        RINHA_TREE_DEPTH: "14"
        RINHA_TREE_QUANTILES: "511"
        RINHA_TREE_MIN_LEAF: "50"
        RINHA_TREE_CONFIDENCE: "0.90"
    environment:
      ROBYN_HOST: "0.0.0.0"
      ROBYN_PORT: "8080"
      ROBYN_LOG_LEVEL: "WARN"
      ROBYN_PROCESSES: "1"
      ROBYN_WORKERS: "1"
      RINHA_IVF_NPROBE: "96"
      RINHA_RERANK_K: "10"
      RINHA_IVF_CELLS: "8192"
      RINHA_IVF_SAMPLE: "250000"
      RINHA_IVF_ITERATIONS: "6"
      RINHA_TREE_SAMPLE: "2000000"
      RINHA_TREE_DEPTH: "14"
      RINHA_TREE_QUANTILES: "511"
      RINHA_TREE_MIN_LEAF: "50"
      RINHA_INDEX_PRELOAD: "1"
      RINHA_RERANK_PRELOAD: "0"
      RINHA_INDEX_WARMUP: "1"
      RINHA_IVF_CELL_PRUNE: "1"
      RINHA_IVF_BATCH_CELLS: "1"
      RINHA_TREE_CONFIDENCE: "0.90"
      RINHA_CELL_FAST_MARGIN: "1.00"
      RINHA_WEIGHTED_KNN: "1"
      RINHA_WEIGHTED_EPS: "0.10"
      RINHA_SCORE_OFFSET: "0.10"
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "165MB"

  api2:
    <<: *api

networks:
  default:
    driver: bridge
