events {
    worker_connections 4096;
}

http {
    access_log off;
    error_log /dev/null emerg;

    upstream api {
        least_conn;
        server api1:8080;
        server api2:8080;
        keepalive 256;
    }

    server {
        listen 9999;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 1s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_pass http://api;
        }
    }
}
